serenity.project.name=SWAG LABS
serenity.test.root=org.example

webdriver.driver=chrome
webdriver.autodownload=true
serenity.browser.maximized=true

# Control del navegador
serenity.use.unique.browser=false
serenity.restart.browser.each.scenario=true

# Flags para que Chrome no muestre mensajes molestos
chrome.switches=--no-sandbox,
--disable-dev-shm-usage,
--disable-infobars,
--disable-extensions,
--remote-allow-origins=*,
--disable-save-password-bubble,
--disable-notifications,
--disable-popup-blocking,
--disable-blink-features=AutomationControlled

# Desactivar administrador de contraseñas y alertas de brechas
chrome.preferences.credentials_enable_service=false
chrome.preferences.profile.password_manager_enabled=false
chrome.preferences.profile.password_manager_leak_detection=false

# Desactivar notificaciones y mensajes adicionales
chrome.preferences.profile.default_content_setting_values.notifications=2
chrome.preferences.profile.default_content_setting_values.automatic_downloads=1

# Nivel de logs (puedes bajarlo a INFO o WARN si quieres menos ruido)
serenity.logging=VERBOSE
